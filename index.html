<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VPNBook Password Mirror</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    #password {
      font-size: 24px;
      font-family: monospace;
      padding: 8px;
    }
  </style>
</head>
<body>

<h2>VPNBook Password</h2>

<input id="password" readonly>

<script>
(async () => {
    try {
        const response = await fetch("https://www.vpnbook.com/freevpn/openvpn");
        const html = await response.text();

        const doc = new DOMParser().parseFromString(html, "text/html");

        const code = [...doc.querySelectorAll("code")]
            .find(el => /^[A-Za-z0-9]{6,12}$/.test(el.textContent.trim()));

        document.getElementById("password").value =
            code ? code.textContent.trim() : "Not found";
    } catch (err) {
        document.getElementById("password").value =
            "Blocked by browser (CORS)";
        console.error(err);
    }
})();
</script>

</body>
</html>
