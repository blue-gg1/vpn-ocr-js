<!DOCTYPE html>
<html lang="en">
    <link rel="stylesheet" href="style.css">
        <head>
        <meta charset="UTF-8">
        <title>VPNBook Password Fetcher</title>
        </head>
    <body>
        <div class="bgimg">
            <div class="middle">
                <h2>VPNBook Password</h2>
                <input id="password" readonly value="Loading...">

                <script>
                    const url = "https://cors-anywhere.herokuapp.com/" + "https://www.vpnbook.com/freevpn/openvpn"
                    async function update() {
                        try {
                            const html = await fetch(url).then(r => r.text());
                            const doc = new DOMParser().parseFromString(html, "text/html");
                            const codes = [...doc.querySelectorAll("code")]
                                .map(e => e.textContent.trim());
                            // Password is the code that's not "vpnbook"
                            const password = codes.find(v => v.toLowerCase() !== "vpnbook");
                            document.getElementById("password").value =
                                password || "Not found";
                        } catch (err) {
                            console.error(err);
                            document.getElementById("password").value = "Error";
                        }
                    }
                </script>
                <h5><i>Brought to you by vpnbook dot com backslash freevpn backslash openvpn</i></h5>
                <br>
                <br>
                <h2>The CORS Button</h2>
                <h5><i>Brought to you by cors-anywhere dot herokuapp dot com</i></h5>
                <iframe>
                    https://cors-anywhere.herokuapp.com/corsdemo
                </iframe>
            </div>
        </div>
    </body>
</html>
